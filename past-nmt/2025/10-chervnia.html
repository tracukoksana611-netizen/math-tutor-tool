{q:'Розв’яжіть нерівність \\(2^{3-x}>\\frac14\\).',o:['\\((-\\infty;-1)\\)','\\((-5;+\\infty)\\)','\\((-\\infty;5)\\)','\\((-1;+\\infty)\\)','\\((5;+\\infty)\\)'],a:2,s:'\\(\\frac14=2^{-2}\\). Оскільки основа 2 більша за 1: \\(3-x>-2\\), звідси \\(x<5\\).'},
{q:'Вершини прямокутника \\(KLMN\\) лежать на сторонах ромба. \\(AK:KB=1:3\\), \\(KM=12\\) см і діагональ утворює зі стороною \\(NM\\) кут \\(30^\\circ\\). Знайдіть площу ромба.',o:['\\(81\\text{ см}^2\\)','\\(96\\sqrt3\\text{ см}^2\\)','\\(96\\text{ см}^2\\)','\\(81\\sqrt3\\text{ см}^2\\)','\\(384\\text{ см}^2\\)'],a:1,s:'У прямокутнику \\(NM=12\\cos30^\\circ=6\\sqrt3\\), \\(KN=12\\sin30^\\circ=6\\). Із \\(AK:KB=1:3\\) та симетрії маємо діагоналі ромба \\(AC=8\\sqrt3\\), \\(BD=24\\). Тоді \\(S=\\frac{AC\\cdot BD}{2}=96\\sqrt3\\text{ см}^2\\).',d:'rhombus'},
{q:'Послідовність задано формулою \\(b_n=\\dfrac{(-1)^n}{n}\\). Обчисліть \\(b_4+b_5\\).',o:['\\(\\frac1{20}\\)','\\(\\frac29\\)','\\(-\\frac1{20}\\)','\\(\\frac9{20}\\)','\\(-\\frac9{20}\\)'],a:0,s:'\\(b_4=\\frac14\\), \\(b_5=-\\frac15\\), тому \\(b_4+b_5=\\frac14-\\frac15=\\frac1{20}\\).'},
{q:'Розкрийте дужки: \\((3+\\sqrt b)^2\\).',o:['\\(9+b\\)','\\(3+b\\)','\\(9+3\\sqrt b+b\\)','\\(9+6\\sqrt b+b\\)','\\(9-6\\sqrt b+b\\)'],a:3,s:'За формулою квадрата суми: \\(9+2\\cdot3\\cdot\\sqrt b+(\\sqrt b)^2=9+6\\sqrt b+b\\).'},
{q:'Розв’яжіть систему \\(\\begin{cases}3x+9=x+1,\\\\ |x-1|+2y+7=0.\\end{cases}\\) Знайдіть \\(x_0+y_0\\).',o:['−5','−2','−10','−0,5','10,5'],a:2,s:'З першого рівняння \\(2x=-8\\), тому \\(x=-4\\). Тоді \\(|-4-1|+2y+7=0\\), \\(5+2y+7=0\\), \\(y=-6\\). Сума: \\(-4-6=-10\\).'},
{type:'match',q:'У прямокутній трапеції проведено висоту \\(CK\\). \\(ABCK\\) — квадрат із діагоналлю \\(12\\sqrt2\\) см, \\(CD=13\\) см. Установіть відповідність.',rows:['висота трапеції \\(ABCD\\)','\\(AD\\)','середня лінія трапеції \\(ABCD\\)'],vals:['12 см','14,5 см','17 см','18 см','29 см'],a:[0,2,1],s:'Сторона квадрата \\(12\\) см, тому висота — 12. У прямокутному трикутнику \\(CKD\\): \\(KD=\\sqrt{13^2-12^2}=5\\). Отже \\(AD=12+5=17\\), середня лінія \\(\\frac{12+17}{2}=14{,}5\\) см.',d:'trap'},
{type:'match',q:'Доберіть до функції властивість її графіка.',rows:['\\(y=\\frac1x-1\\)','\\(y=x^2-4x+5\\)','\\(y=2\\cos x\\)'],vals:['перетинає лише вісь \\(y\\)','перетинає лише вісь \\(x\\)','не перетинає жодної з осей','симетричний відносно осі \\(x\\)','симетричний відносно осі \\(y\\)'],a:[1,0,4],s:'1) При \\(y=0\\) маємо \\(x=1\\), а при \\(x=0\\) функція не визначена — лише вісь \\(x\\). 2) \\(y=(x-2)^2+1>0\\), тому перетинає лише вісь \\(y\\). 3) Косинус — парна функція, графік симетричний відносно осі \\(y\\).'},
{type:'match',q:'Установіть відповідність між виразом і твердженням про його значення.',rows:['\\((3\\pi-1)^0\\)','\\(\\log_{\\pi}\\frac1{\\pi^3}\\)','\\(3\\tan\\frac{\\pi}{3}\\)'],vals:['натуральне число','ціле недодатне число','раціональне неціле число','ірраціональне додатне число','ірраціональне від’ємне число'],a:[0,1,3],s:'1) \\((3\\pi-1)^0=1\\) — натуральне. 2) \\(\\frac1{\\pi^3}=\\pi^{-3}\\), тому логарифм дорівнює \\(-3\\). 3) \\(3\\tan\\frac\\pi3=3\\sqrt3\\) — додатне ірраціональне число.'},
{type:'input',q:'Визначте \\(a\\), якщо сума коренів рівняння \\(4x-\\sqrt{4x+a}+a=0\\) дорівнює 10.',a:-19.5,s:'Позначимо \\(t=\\sqrt{4x+a}\\), де \\(t\\ge0\\). Тоді \\(4x=t^2-a\\), а рівняння набуває вигляду \\(t^2-t=0\\). Маємо \\(t=0\\) або \\(t=1\\), звідси корені \\(x_1=-\\frac a4\\), \\(x_2=\\frac{1-a}{4}\\). Їх сума \\(\\frac{1-2a}{4}=10\\), тому \\(a=-19{,}5\\).'},
{type:'input',q:'Похідна лінійної функції \\(f(x)\\) дорівнює −5, а нуль функції дорівнює 1,5. Обчисліть \\(f(-2)\\).',a:17.5,s:'\\(f(x)=-5x+b\\). Оскільки \\(f(1{,}5)=0\\), то \\(-7{,}5+b=0\\), звідси \\(b=7{,}5\\). Тоді \\(f(-2)=10+7{,}5=17{,}5\\).'},
{type:'input',q:'Температури за сім днів мають середнє значення, що збігається з модою. Знайдіть температуру в неділю.',a:20,s:'Мода відомих значень — \\(23^\\circ C\\) (зустрічається тричі), отже середнє теж 23. Сума семи значень має бути \\(7\\cdot23=161\\). Сума за понеділок–суботу: \\(23+21+23+27+23+24=141\\). Неділя: \\(161-141=20^\\circ C\\).',d:'bars'},
{type:'input',q:'Конус і правильна трикутна призма мають рівні висоти. Радіус описаного навколо основи призми кола дорівнює радіусу конуса. Сторона основи призми — 12 см, твірна конуса — \\(5\\sqrt3\\) см. Знайдіть об’єм призми.',a:324,s:'Для рівностороннього трикутника \\(R=\\frac{a}{\\sqrt3}=4\\sqrt3\\). Це радіус конуса. Його висота \\(h=\\sqrt{(5\\sqrt3)^2-(4\\sqrt3)^2}=\\sqrt{75-48}=3\\sqrt3\\). Площа основи призми \\(S=\\frac{12^2\\sqrt3}{4}=36\\sqrt3\\). Тоді \\(V=Sh=36\\sqrt3\\cdot3\\sqrt3=324\\text{ см}^3\\).'}
];
function render(){const root=document.getElementById('tasks');root.innerHTML=tasks.map((t,i)=>{const n=i+1;let body='';if(t.type==='match'){body=t.rows.map((r,j)=>`<div class="match"><div><span class="letter">${j+1}.</span> ${r}</div><select data-i="${i}" data-j="${j}" onchange="progress()"><option value="">— виберіть —</option>${t.vals.map((v,k)=>`<option value="${k}">${L[k]}. ${v}</option>`).join('')}</select></div>`).join('')}else if(t.type==='input'){body=`<input type="text" inputmode="decimal" data-i="${i}" placeholder="Уведіть число" oninput="progress()">`}else{body=`<div class="options">${t.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="progress()"><span class="letter">${L[j]}</span><span>${o}</span></label>`).join('')}</div>`}return `<article class="task" id="t${n}"><h2>Завдання ${n}</h2><div class="taskgrid"><div><div>${t.q}</div>${body}<button class="secondary checkone" onclick="toggleSol(${i})">▸ Розв’язання</button><div class="feedback" id="f${i}"></div><div class="solution" id="s${i}"><b>Покрокове розв’язання</b><br>${t.s}</div></div>${t.d?`<div class="diagram">${diagrams[t.d]}</div>`:''}</div></article>`}).join('');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root])}
function answer(i){const t=tasks[i];if(t.type==='match')return t.rows.map((_,j)=>document.querySelector(`select[data-i="${i}"][data-j="${j}"]`).value);if(t.type==='input')return document.querySelector(`input[data-i="${i}"]`).value.trim().replace(',','.');return document.querySelector(`input[name="q${i}"]:checked`)?.value??''}
function isOK(i){const t=tasks[i],v=answer(i);if(t.type==='match')return v.every((x,j)=>Number(x)===t.a[j]);if(t.type==='input')return v!==''&&Math.abs(Number(v)-t.a)<1e-6;return Number(v)===t.a}
function right(t){if(t.type==='match')return t.a.map((x,j)=>`${j+1}–${L[x]}`).join('; ');if(t.type==='input')return String(t.a).replace('.',',');return `${L[t.a]}: ${t.o[t.a]}`}
function shown(t,v){if(t.type==='match')return v.map((x,j)=>`${j+1}–${x===''?'—':L[Number(x)]}`).join('; ');if(t.type==='input')return v||'немає відповіді';return v===''?'немає відповіді':`${L[Number(v)]}: ${t.o[Number(v)]}`}
function toggleSol(i){document.getElementById('s'+i).classList.toggle('open');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('s'+i)])}
function checkAll(){let score=0,miss=[];tasks.forEach((t,i)=>{const ok=isOK(i),f=document.getElementById('f'+i);if(ok){score++;f.className='feedback ok';f.textContent='✓ Правильно'}else{f.className='feedback bad';f.textContent='✗ Потрібно виправити';miss.push({i,t,v:answer(i)});document.getElementById('s'+i).classList.add('open')}});const p=Math.round(score/tasks.length*100),s=document.getElementById('summary');s.classList.add('show');s.innerHTML=`<div class="score">Результат: ${score} із ${tasks.length} (${p}%)</div>${miss.length?'<h2>Аналіз помилок</h2>'+miss.map(m=>`<div class="mistake"><b>Завдання ${m.i+1}</b><br><span class="small">Ваша відповідь:</span> ${shown(m.t,m.v)}<br><span class="small">Правильна відповідь:</span> ${right(m.t)}<br><b>Як розв’язати:</b> ${m.t.s}</div>`).join(''):'<p class="ok"><b>Блискуче! Усі відповіді правильні.</b></p>'}`;s.scrollIntoView({behavior:'smooth'});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([s])}
function progress(){let done=0;tasks.forEach((t,i)=>{const v=answer(i);if(t.type==='match'?v.every(Boolean):v!=='')done++});document.getElementById('bar').style.width=(done/tasks.length*100)+'%'}
function resetAll(){document.querySelectorAll('input').forEach(x=>{x.checked=false;x.value=''});document.querySelectorAll('select').forEach(x=>x.value='');document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.querySelectorAll('.solution').forEach(x=>x.classList.remove('open'));document.getElementById('summary').classList.remove('show');progress();scrollTo({top:0,behavior:'smooth'})}
render();
</script>
</body></html>
