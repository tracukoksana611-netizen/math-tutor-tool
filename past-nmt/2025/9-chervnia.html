{type:'match',q:'У прямокутнику \\(ABCD\\): \\(AB=6\\) см, \\(AD=8\\) см, \\(O\\) — перетин діагоналей, \\(OM\\perp AD\\). Узгодьте фігуру з площею.',rows:['\\(\\triangle ABD\\)','\\(\\triangle AOD\\)','п’ятикутник \\(ABCOM\\)'],opts:['12 см²','18 см²','24 см²','30 см²','36 см²'],a:[2,0,3],img:'rect',e:'Площа прямокутника \\(6\\cdot8=48\\). 1) Діагональ ділить його навпіл: \\(S_{ABD}=24\\) — В. 2) \\(OM=3\\), тому \\(S_{AOD}=\\frac12\\cdot8\\cdot3=12\\) — А. 3) П’ятикутник \\(ABCOM\\) складається з трикутників \\(ABO\\), \\(BCO\\) і \\(AOM\\). Їхні площі: \\(12\\), \\(12\\) і \\(6\\) см². Отже, \\(S_{ABCOM}=12+12+6=30\\) см² — Г.'},

{type:'match',q:'Доберіть до виразу його значення.',rows:['\\(\\log_3 27\\)','\\(\\tan\\frac{2\\pi}{3}\\)','\\(\\frac1{\\sqrt5-\\sqrt2}:(\\sqrt5+\\sqrt2)\\)'],opts:['\\(-3\\)','\\(\\sqrt3\\)','\\(\\frac13\\)','\\(-\\sqrt3\\)','3'],a:[4,3,2],e:'1) \\(\\log_3 27=3\\) — Д. 2) \\(\\tan(2\\pi/3)=-\\sqrt3\\) — Г. 3) \\(\\frac1{(\\sqrt5-\\sqrt2)(\\sqrt5+\\sqrt2)}=\\frac1{5-2}=\\frac13\\) — В.'},
{type:'short',q:'Знайдіть суму всіх цілих \\(a\\), за яких рівняння \\(\\dfrac{2^{4x+2a-15}-2\\sqrt2}{\\sqrt{2-x}}=0\\) має додатний корінь.',a:'26',e:'Знаменник вимагає \\(x<2\\). Чисельник дорівнює нулю: \\(2^{4x+2a-15}=2\\sqrt2=2^{3/2}\\), тому \\(4x+2a-15=3/2\\) і \\(x=\\frac{33}{8}-\\frac a2\\). Умова \\(0<x<2\\) дає \\(4{,}25<a<8{,}25\\). Цілі значення: 5, 6, 7, 8; сума \\(26\\).'},
{type:'short',q:'\\(f(x)=3\\) для \\(x>0\\), \\(f(x)=1\\) для \\(x<0\\). \\(g\\) — пряма пропорційність, графік проходить через \\((1;0{,}5)\\). Обчисліть \\(\\dfrac{5g(-1)+3f(2)}{f(-1)}\\).',a:'6.5',e:'\\(g(x)=0{,}5x\\), тому \\(g(-1)=-0{,}5\\). Також \\(f(2)=3\\), \\(f(-1)=1\\). Отже, \\((5\\cdot(-0{,}5)+3\\cdot3)/1=-2{,}5+9=6{,}5\\).'},
{type:'short',q:'За 5 днів в офісі в середньому споживали 79,2 л води щодня. Використано 12 пляшок по 5 л, 6 пляшок по 20 л, а пляшок по 10 л було втричі більше, ніж по 6 л. Скільки використано 10-літрових пляшок?',a:'18',e:'Усього води \\(79{,}2\\cdot5=396\\) л. Відомі пляшки містять \\(12\\cdot5+6\\cdot20=180\\) л. Нехай 6-літрових пляшок \\(x\\), тоді 10-літрових \\(3x\\). \\(6x+10\\cdot3x=216\\Rightarrow36x=216\\Rightarrow x=6\\). Тому \\(3x=18\\).'},
{type:'short',q:'Площа сфери \\(300\\pi\\) см². Радіус основи конуса дорівнює радіусу сфери, а твірна нахилена до основи під кутом \\(30^\\circ\\). Знайдіть \\(V/\\pi\\).',a:'125',e:'\\(4\\pi R^2=300\\pi\\Rightarrow R^2=75\\), отже радіус конуса \\(r=5\\sqrt3\\). В осьовому перерізі \\(\\tan30^\\circ=h/r\\), тому \\(h=r/\\sqrt3=5\\). \\(V/\\pi=\\frac13r^2h=\\frac13\\cdot75\\cdot5=125\\).'}];
function inputHTML(t,i){if(t.type==='match')return `<div class="match"><table><tr><th>№</th><th>Елемент</th><th>Відповідь</th></tr>${t.rows.map((r,j)=>`<tr><td>${j+1}</td><td>${r}</td><td><select id="m${i}_${j}"><option value="">—</option>${t.opts.map((o,k)=>`<option value="${k}">${L[k]}. ${o}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;if(t.type==='short')return `<input class="short" id="s${i}" inputmode="decimal" placeholder="Введіть число">`;return `<div class="opts">${t.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><b>${L[j]}.</b><span>${o}</span></label>`).join('')}</div>`}
function build(){document.getElementById('test').innerHTML=T.map((t,i)=>`<article class="task" id="task${i+1}"><span class="badge">Завдання ${i+1}</span><div class="${t.img?'layout':''}">${t.img?`<img class="fig" src="${IMG[t.img]}" alt="Рисунок до завдання ${i+1}">`:''}<div><div class="q">${t.q}</div>${inputHTML(t,i)}<button class="no-print" onclick="check(${i})">Перевірити</button><div class="feedback" id="f${i}"></div><details><summary>Розв’язання</summary><div>${t.e}</div></details></div></div></article>`).join('');typeset()}
function norm(x){return String(x??'').trim().replace(',','.').replace(/\s/g,'')}function ans(i){const t=T[i];if(t.type==='short')return norm(document.getElementById('s'+i).value);if(t.type==='match')return t.rows.map((_,j)=>{const v=document.getElementById(`m${i}_${j}`).value;return v===''?null:+v});const x=document.querySelector(`input[name="q${i}"]:checked`);return x?+x.value:null}function good(i){const t=T[i],v=ans(i);return t.type==='short'?v===norm(t.a):t.type==='match'?v.every((x,j)=>x===t.a[j]):v===t.a}function pretty(i,v){const t=T[i];return t.type==='short'?(v||'не введено'):t.type==='match'?v.map((x,j)=>`${j+1}–${x===null?'—':L[x]}`).join('; '):(v===null?'не вибрано':L[v])}function right(i){const t=T[i];return t.type==='short'?t.a.replace('.',','):t.type==='match'?t.a.map((x,j)=>`${j+1}–${L[x]}`).join('; '):L[t.a]}
function check(i){const f=document.getElementById('f'+i),v=ans(i),empty=T[i].type==='match'?v.some(x=>x===null):(v===null||v==='');if(empty){f.className='feedback bad';f.textContent='Спочатку введіть або виберіть відповідь.';return}const ok=good(i);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Правильно!':`✗ Неправильно. Правильна відповідь: ${right(i)}.`;document.getElementById('task'+(i+1)).classList.toggle('done',ok);save();typeset()}
function finish(){let n=0,h='';T.forEach((t,i)=>{const v=ans(i);if(good(i))n++;else h+=`<div class="error"><b>Завдання ${i+1}</b><br>Ваша відповідь: ${pretty(i,v)}<br>Правильна відповідь: ${right(i)}<details open><summary>Повне розв’язання</summary>${t.e}</details></div>`});document.getElementById('score').textContent=`Результат: ${n} із ${T.length}`;document.getElementById('errors').innerHTML=h||'<p class="ok"><b>Усі завдання виконано правильно!</b></p>';document.getElementById('results').classList.add('show');document.getElementById('results').scrollIntoView({behavior:'smooth'});save();typeset()}
function save(){localStorage.setItem('nmt9jun2025',JSON.stringify(T.map((_,i)=>ans(i))))}function load(){try{const d=JSON.parse(localStorage.getItem('nmt9jun2025'));if(!d)return;d.forEach((v,i)=>{const t=T[i];if(t.type==='short'&&v!=null)document.getElementById('s'+i).value=v;else if(t.type==='match'&&Array.isArray(v))v.forEach((x,j)=>{if(x!==null)document.getElementById(`m${i}_${j}`).value=x});else if(v!==null){const x=document.querySelector(`input[name="q${i}"][value="${v}"]`);if(x)x.checked=true}})}catch(e){}}function resetTest(){if(confirm('Очистити всі відповіді?')){localStorage.removeItem('nmt9jun2025');location.reload()}}function go(n){document.getElementById('task'+n).scrollIntoView({behavior:'smooth'})}function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise()}
function printTest(){const w=window.open('','_blank');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>НМТ 9 червня 2025</title><style>body{font-family:Arial;padding:25px;line-height:1.5}.task{border:1px solid #bbb;padding:16px;margin:14px 0;break-inside:avoid}.fig{max-width:330px;max-height:250px}.no-print,.feedback{display:none}.opt{display:block;margin:5px}</style><script>window.MathJax={tex:{inlineMath:[["\\\\(","\\\\)"],["$","$"]],displayMath:[["\\\\[","\\\\]"]]}};<\\/script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\\/script></head><body><h1>НМТ з математики — 9 червня 2025 року</h1>'+document.getElementById('test').innerHTML+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print()},1000)}build();load();</script></body></html>
