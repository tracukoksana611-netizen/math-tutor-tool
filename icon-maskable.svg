<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (no rounding for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Content within safe zone (20% padding = 102px each side, so 308x308 centered at 256,256) -->
  <!-- Radical sign scaled to safe zone -->
  <polyline
    points="130,315 175,360 235,180 400,180"
    stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- x² under the radical, within safe zone -->
  <text x="308" y="325"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="105"
    font-weight="bold"
    fill="white"
    text-anchor="middle">x</text>
  <text x="375" y="268"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="55"
    font-weight="bold"
    fill="white"
    text-anchor="middle">2</text>
</svg>
