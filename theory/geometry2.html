<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Intelligence — Трикутники</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f3f6fb;
    --white:#ffffff;
    --panel:#f8fafc;
    --border:#d7e0eb;
    --text:#172033;
    --muted:#64748b;
    --primary:#4f46e5;
    --primary2:#6366f1;
    --green:#15803d;
    --blue:#2563eb;
    --orange:#c2410c;
    --red:#dc2626;
    --yellow:#b45309;
}

html,
body{
    width:100%;
    height:100%;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:22px;
    color:var(--text);
    background:var(--bg);
}

body{
    display:flex;
    overflow:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:290px;
    min-width:290px;
    height:100vh;
    background:#fff;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

.logo{
    padding:22px 20px;
    border-bottom:1px solid var(--border);
}

.logo-icon{
    width:54px;
    height:54px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#4f46e5,#8b5cf6);
    color:white;
    font-size:29px;
    margin-bottom:12px;
}

.logo h1{
    font-size:22px;
    line-height:1.2;
    color:#111827;
}

.logo p{
    color:var(--muted);
    font-size:16px;
    margin-top:6px;
}

.nav-title{
    padding:18px 17px 10px;
    font-size:14px;
    color:var(--muted);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.06em;
}

#navList{
    padding:0 8px;
}

.nav-item{
    width:100%;
    border:0;
    background:transparent;
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 10px;
    border-radius:11px;
    color:#334155;
    text-align:left;
    margin-bottom:4px;
}

.nav-item:hover{
    background:#f1f5f9;
}

.nav-item.active{
    background:#eef2ff;
    color:#3730a3;
}

.nav-number{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    background:#e8edf4;
    display:grid;
    place-items:center;
    font-size:14px;
    font-weight:800;
}

.nav-item.active .nav-number{
    background:var(--primary);
    color:#fff;
}

.nav-item.done .nav-number{
    background:#dcfce7;
    color:var(--green);
}

.nav-name{
    font-size:17px;
    font-weight:700;
    line-height:1.35;
}

.sidebar-bottom{
    margin-top:auto;
    padding:16px;
    border-top:1px solid var(--border);
}

.progress-label{
    font-size:14px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
}

.progress-text{
    font-size:18px;
    font-weight:800;
    margin:7px 0 9px;
}

.progress-track{
    height:9px;
    border-radius:999px;
    background:#e2e8f0;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#4f46e5,#818cf8);
    transition:.3s;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    min-height:78px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 25px;
}

.top-info{
    min-width:180px;
    color:var(--muted);
    font-size:15px;
}

.top-info strong{
    color:var(--primary);
}

.top-title{
    flex:1;
    font-size:25px;
    font-weight:850;
    color:#111827;
}

.top-progress{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--muted);
    font-size:15px;
}

.top-progress .track{
    width:110px;
    height:9px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
}

.top-progress .fill{
    height:100%;
    background:var(--primary);
    width:0;
    transition:.3s;
}

/* =========================
   CONTENT
========================= */

.content{
    flex:1;
    min-height:0;
    display:flex;
}

.lesson{
    flex:1;
    min-width:0;
    overflow-y:auto;
    padding:36px 40px 50px;
    background:var(--bg);
}

.lesson h2{
    font-size:38px;
    line-height:1.2;
    color:#111827;
    margin-bottom:22px;
}

.lesson h3{
    font-size:27px;
    color:#1e293b;
    margin:30px 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
}

.lesson h3::before{
    content:"";
    display:block;
    width:6px;
    height:28px;
    border-radius:4px;
    background:var(--primary);
}

.lesson p{
    font-size:21px;
    line-height:1.7;
}

.box{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:21px 23px;
    font-size:21px;
    line-height:1.7;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(15,23,42,.05);
}

.box strong{
    color:#3730a3;
}

.formula{
    padding:17px 20px;
    background:#ecfdf5;
    border:2px solid #86efac;
    color:#047857;
    border-radius:13px;
    font-size:27px;
    font-weight:900;
    text-align:center;
    margin:18px 0;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin:17px 0;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:19px;
    box-shadow:0 4px 15px rgba(15,23,42,.05);
}

.card h4{
    font-size:22px;
    margin-bottom:9px;
    color:#3730a3;
}

.card p{
    font-size:18px;
    line-height:1.65;
    color:#475569;
}

.red{
    color:var(--red)!important;
}

.green{
    color:var(--green)!important;
}

.blue{
    color:var(--blue)!important;
}

.orange{
    color:var(--orange)!important;
}

.task{
    background:#fffbeb;
    border:1px solid #fde68a;
    padding:19px 21px;
    border-radius:14px;
    font-size:20px;
    line-height:1.7;
    margin:14px 0;
}

/* =========================
   CONSTRUCTOR
========================= */

.constructor{
    width:460px;
    min-width:420px;
    background:#fff;
    border-left:1px solid var(--border);
    overflow-y:auto;
}

.constructor-head{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.constructor-head h3{
    font-size:23px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    padding:12px;
    border-bottom:1px solid var(--border);
}

.tab{
    border:1px solid #cbd5e1;
    background:#fff;
    color:#475569;
    border-radius:8px;
    padding:8px 11px;
    font-size:15px;
    font-weight:700;
}

.tab:hover{
    background:#f1f5f9;
}

.tab.active{
    background:#eef2ff;
    color:#3730a3;
    border-color:#818cf8;
}

.svg-area{
    background:#fff;
    padding:12px;
    border-bottom:1px solid var(--border);
}

#triangleSvg{
    width:100%;
    height:auto;
    display:block;
    background:#fff;
    touch-action:none;
}

.data{
    padding:17px;
}

.data-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.data-cell{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
}

.data-key{
    color:var(--muted);
    font-size:14px;
    font-weight:800;
}

.data-value{
    color:#111827;
    font-size:21px;
    font-weight:900;
    margin-top:3px;
}

.type-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.type-box{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
}

.type-box small{
    display:block;
    color:var(--muted);
    font-size:14px;
    font-weight:800;
    margin-bottom:5px;
}

.type-box b{
    font-size:18px;
}

.angle-sum{
    margin-top:12px;
    background:#ecfdf5;
    border:1px solid #86efac;
    border-radius:10px;
    padding:12px;
    display:flex;
    justify-content:space-between;
    font-size:17px;
    color:#166534;
    font-weight:800;
}

.ineq{
    margin-top:12px;
    background:#fff1f2;
    border:1px solid #fecdd3;
    border-radius:10px;
    padding:13px;
    font-size:16px;
    line-height:1.8;
}

.ineq-title{
    font-weight:900;
    color:#be123c;
    margin-bottom:5px;
}

/* =========================
   FOOTER
========================= */

.footer{
    min-height:76px;
    padding:12px 25px;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.footer button{
    border:1px solid #cbd5e1;
    background:#f8fafc;
    color:#334155;
    padding:12px 23px;
    border-radius:10px;
    font-size:18px;
    font-weight:800;
}

.footer button:hover{
    background:#eef2ff;
}

.footer button.primary{
    color:#fff;
    background:linear-gradient(135deg,#4f46e5,#6366f1);
    border-color:#4f46e5;
}

.footer button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.footer-status{
    font-size:17px;
    color:var(--muted);
    font-weight:700;
}

/* =========================
   SCROLL
========================= */

::-webkit-scrollbar{
    width:9px;
}

::-webkit-scrollbar-track{
    background:#f1f5f9;
}

::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:999px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1150px){
    .sidebar{
        width:250px;
        min-width:250px;
    }

    .constructor{
        width:390px;
        min-width:360px;
    }

    .lesson{
        padding:28px;
    }

    .lesson h2{
        font-size:33px;
    }

    .grid3{
        grid-template-columns:1fr;
    }
}

@media(max-width:900px){
    .sidebar{
        display:none;
    }

    .constructor{
        width:350px;
        min-width:330px;
    }
}

@media(max-width:700px){
    body{
        overflow:auto;
    }

    .main{
        height:auto;
        min-height:100vh;
    }

    .content{
        display:block;
    }

    .lesson{
        overflow:visible;
        padding:22px;
    }

    .constructor{
        width:100%;
        min-width:0;
        border-left:0;
        border-top:1px solid var(--border);
    }

    .top-title{
        font-size:20px;
    }

    .top-progress{
        display:none;
    }

    .lesson h2{
        font-size:30px;
    }

    .lesson h3{
        font-size:24px;
    }

    .box,
    .lesson p{
        font-size:19px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">📐</div>
        <h1>Geometry Intelligence</h1>
        <p>Інтерактивна геометрія</p>
    </div>

    <div class="nav-title">
        Навчальний маршрут
    </div>

    <div id="navList"></div>

    <div class="sidebar-bottom">
        <div class="progress-label">
            Загальний прогрес
        </div>

        <div class="progress-text" id="sideProgressText">
            0 із 8 модулів
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="sideProgress"></div>
        </div>
    </div>

</aside>


<div class="main">

    <header class="topbar">

        <div class="top-info">
            <strong id="moduleNumber">
                Модуль 1 із 8
            </strong>
        </div>

        <div class="top-title" id="topTitle">
            Трикутник і його елементи
        </div>

        <div class="top-progress">

            <span>Прогрес</span>

            <div class="track">
                <div class="fill" id="topProgress"></div>
            </div>

            <b id="topProgressText">0%</b>

        </div>

    </header>


    <div class="content">

        <main class="lesson" id="lesson"></main>


        <aside class="constructor">

            <div class="constructor-head">
                <h3>🔺 Інтерактивний конструктор</h3>
            </div>

            <div class="tabs">

                <button class="tab active" data-mode="labels">
                    Позначення
                </button>

                <button class="tab" data-mode="medians">
                    Медіани
                </button>

                <button class="tab" data-mode="heights">
                    Висоти
                </button>

                <button class="tab" data-mode="bisectors">
                    Бісектриси
                </button>

                <button class="tab" data-mode="circles">
                    Кола
                </button>

                <button class="tab" id="resetButton">
                    ↺
                </button>

            </div>


            <div class="svg-area">

                <svg
                    id="triangleSvg"
                    viewBox="0 0 400 290">

                    <defs>
                        <pattern
                            id="grid"
                            width="20"
                            height="20"
                            patternUnits="userSpaceOnUse">

                            <circle
                                cx="1"
                                cy="1"
                                r="1"
                                fill="#dbe3ec">
                            </circle>

                        </pattern>
                    </defs>

                    <rect
                        x="0"
                        y="0"
                        width="400"
                        height="290"
                        fill="url(#grid)">
                    </rect>

                    <g id="extraLines"></g>

                    <polygon
                        id="triangle"
                        fill="rgba(79,70,229,.08)"
                        stroke="#4f46e5"
                        stroke-width="3">
                    </polygon>

                    <g id="sideLabels"></g>

                    <circle
                        id="pointA"
                        r="10"
                        fill="#ef4444"
                        stroke="#ffffff"
                        stroke-width="3">
                    </circle>

                    <circle
                        id="pointB"
                        r="10"
                        fill="#2563eb"
                        stroke="#ffffff"
                        stroke-width="3">
                    </circle>

                    <circle
                        id="pointC"
                        r="10"
                        fill="#16a34a"
                        stroke="#ffffff"
                        stroke-width="3">
                    </circle>

                    <text
                        id="labelA"
                        font-size="18"
                        font-weight="900"
                        fill="#b91c1c">A</text>

                    <text
                        id="labelB"
                        font-size="18"
                        font-weight="900"
                        fill="#1d4ed8">B</text>

                    <text
                        id="labelC"
                        font-size="18"
                        font-weight="900"
                        fill="#15803d">C</text>

                </svg>

            </div>


            <div class="data">

                <div class="data-grid" id="dataGrid"></div>

                <div class="type-grid">

                    <div class="type-box">
                        <small>За сторонами</small>
                        <b id="sideType"></b>
                    </div>

                    <div class="type-box">
                        <small>За кутами</small>
                        <b id="angleType"></b>
                    </div>

                </div>

                <div class="angle-sum">
                    <span>Сума кутів</span>
                    <span>180° ✓</span>
                </div>

                <div class="ineq">
                    <div class="ineq-title">
                        Нерівність трикутника
                    </div>

                    <div id="ineqText"></div>
                </div>

            </div>

        </aside>

    </div>


    <footer class="footer">

        <button id="prevButton">
            ← Назад
        </button>

        <div class="footer-status" id="footerStatus">
            Модуль 1 із 8
        </div>

        <button class="primary" id="nextButton">
            Далі →
        </button>

    </footer>

</div>


<script>
"use strict";

/* =========================
   LESSON MODULES
========================= */

const modules = [

{
    title:"Трикутник і його елементи",
    content:`
        <h2>Трикутник і його елементи</h2>

        <div class="box">
            <strong>Трикутник</strong> — геометрична фігура,
            утворена трьома точками, які не лежать на одній
            прямій, і трьома відрізками, що сполучають ці точки.
        </div>

        <h3>Основні елементи</h3>

        <div class="grid3">

            <div class="card">
                <h4>🔴 Вершини</h4>
                <p>
                    Точки <strong>A, B, C</strong> називають
                    вершинами трикутника.
                </p>
            </div>

            <div class="card">
                <h4>📏 Сторони</h4>
                <p>
                    Відрізки AB, BC та AC утворюють
                    сторони трикутника.
                </p>
            </div>

            <div class="card">
                <h4>📐 Кути</h4>
                <p>
                    ∠A, ∠B і ∠C — внутрішні кути
                    трикутника.
                </p>
            </div>

        </div>

        <div class="formula">
            P = a + b + c
        </div>

        <h3>Основні лінії трикутника</h3>

        <div class="grid3">

            <div class="card">
                <h4 class="green">Медіана</h4>
                <p>
                    Відрізок, який сполучає вершину
                    із серединою протилежної сторони.
                </p>
            </div>

            <div class="card">
                <h4 class="blue">Бісектриса</h4>
                <p>
                    Відрізок бісектриси кута від вершини
                    до протилежної сторони.
                </p>
            </div>

            <div class="card">
                <h4 class="red">Висота</h4>
                <p>
                    Перпендикуляр, проведений із вершини
                    до прямої протилежної сторони.
                </p>
            </div>

        </div>
    `
},

{
    title:"Види трикутників",
    content:`
        <h2>Види трикутників</h2>

        <div class="box">
            Трикутники класифікують
            <strong>за сторонами</strong> та
            <strong>за кутами</strong>.
        </div>

        <h3>За сторонами</h3>

        <div class="grid3">

            <div class="card">
                <h4 class="orange">Різносторонній</h4>
                <p>Усі три сторони мають різну довжину.</p>
            </div>

            <div class="card">
                <h4 class="blue">Рівнобедрений</h4>
                <p>Дві сторони трикутника рівні.</p>
            </div>

            <div class="card">
                <h4 class="green">Рівносторонній</h4>
                <p>Усі три сторони рівні.</p>
            </div>

        </div>

        <h3>За кутами</h3>

        <div class="grid3">

            <div class="card">
                <h4 class="green">Гострокутний</h4>
                <p>Усі кути менші за 90°.</p>
            </div>

            <div class="card">
                <h4 class="blue">Прямокутний</h4>
                <p>Один кут дорівнює 90°.</p>
            </div>

            <div class="card">
                <h4 class="orange">Тупокутний</h4>
                <p>Один кут більший за 90°.</p>
            </div>

        </div>

        <div class="task">
            🔬 Перетягуй вершини конструктора праворуч
            і спостерігай, як автоматично змінюється
            тип трикутника.
        </div>
    `
},

{
    title:"Ознаки рівності",
    content:`
        <h2>Ознаки рівності трикутників</h2>

        <div class="box">
            Два трикутники називають
            <strong>рівними</strong>, якщо їх можна
            сумістити накладанням.
        </div>

        <h3>Перша ознака — СКС</h3>

        <div class="box">
            Якщо дві сторони і кут між ними одного
            трикутника відповідно дорівнюють двом
            сторонам і куту між ними другого
            трикутника, то такі трикутники рівні.
        </div>

        <div class="formula">
            Сторона — Кут — Сторона
        </div>

        <h3>Друга ознака — КСК</h3>

        <div class="box">
            Якщо сторона і два прилеглі до неї кути
            одного трикутника відповідно дорівнюють
            стороні і двом прилеглим до неї кутам
            другого трикутника, то трикутники рівні.
        </div>

        <div class="formula">
            Кут — Сторона — Кут
        </div>

        <h3>Третя ознака — ССС</h3>

        <div class="box">

/* =========================
   MODULE NAVIGATION
========================= */

let currentModule = 0;
const completed = new Set();

const lesson = document.getElementById("lesson");
const navList = document.getElementById("navList");

function renderNav(){

    navList.innerHTML = "";

    modules.forEach((module,index)=>{

        const button =
            document.createElement("button");

        button.className =
            "nav-item" +
            (index === currentModule ? " active" : "") +
            (completed.has(index) ? " done" : "");

        button.innerHTML = `
            <span class="nav-number">
                ${completed.has(index) ? "✓" : index+1}
            </span>

            <span class="nav-name">
                ${module.title}
            </span>
        `;

        button.addEventListener("click",()=>{
            if(index !== currentModule){
                completed.add(currentModule);
            }

            currentModule = index;
            renderModule();
        });

        navList.appendChild(button);
    });
}

function renderModule(){

    const module = modules[currentModule];

    lesson.innerHTML = module.content;

    document.getElementById("moduleNumber")
        .textContent =
        `Модуль ${currentModule+1} із ${modules.length}`;

    document.getElementById("topTitle")
        .textContent = module.title;

    document.getElementById("footerStatus")
        .textContent =
        `Модуль ${currentModule+1} із ${modules.length}`;

    const prev =
        document.getElementById("prevButton");

    const next =
        document.getElementById("nextButton");

    prev.disabled =
        currentModule === 0;

    next.textContent =
        currentModule === modules.length-1
        ? "Завершити ✓"
        : "Далі →";

    updateProgress();
    renderNav();

    lesson.scrollTop = 0;
}

function updateProgress(){

    const percent =
        Math.round(
            completed.size /
            modules.length *
            100
        );

    document.getElementById("sideProgress")
        .style.width = percent + "%";

    document.getElementById("topProgress")
        .style.width = percent + "%";

    document.getElementById("topProgressText")
        .textContent = percent + "%";

    document.getElementById("sideProgressText")
        .textContent =
        `${completed.size} із ${modules.length} модулів`;
}

document.getElementById("prevButton")
.addEventListener("click",()=>{

    if(currentModule > 0){

        completed.add(currentModule);

        currentModule--;

        renderModule();
    }
});

document.getElementById("nextButton")
.addEventListener("click",()=>{

    completed.add(currentModule);

    if(currentModule < modules.length-1){
        currentModule++;
    }

    renderModule();
});


/* =========================
   GEOMETRY
========================= */

const svg =
    document.getElementById("triangleSvg");

const triangle =
    document.getElementById("triangle");

const extraLines =
    document.getElementById("extraLines");

const sideLabels =
    document.getElementById("sideLabels");

const NS =
    "http://www.w3.org/2000/svg";

let points = {
    A:{x:200,y:35},
    B:{x:50,y:245},
    C:{x:350,y:245}
};

let mode = "labels";
let dragging = null;

function distance(p1,p2){

    return Math.hypot(
        p2.x-p1.x,
        p2.y-p1.y
    );
}

function midpoint(p1,p2){

    return {
        x:(p1.x+p2.x)/2,
        y:(p1.y+p2.y)/2
    };
}

function centroid(A,B,C){

    return {
        x:(A.x+B.x+C.x)/3,
        y:(A.y+B.y+C.y)/3
    };
}

function angle(vertex,p1,p2){

    const a = {
        x:p1.x-vertex.x,
        y:p1.y-vertex.y
    };

    const b = {
        x:p2.x-vertex.x,
        y:p2.y-vertex.y
    };

    const dot =
        a.x*b.x +
        a.y*b.y;

    const length =
        Math.hypot(a.x,a.y) *
        Math.hypot(b.x,b.y);

    if(length === 0){
        return 0;
    }

    let cos = dot/length;

    cos =
        Math.max(-1,Math.min(1,cos));

    return Math.acos(cos) *
           180/Math.PI;
}

function perpendicularFoot(P,A,B){

    const dx = B.x-A.x;
    const dy = B.y-A.y;

    const denominator =
        dx*dx+dy*dy;

    if(denominator === 0){
        return {...A};
    }

    const t =
        (
            (P.x-A.x)*dx +
            (P.y-A.y)*dy
        ) / denominator;

    return {
        x:A.x+t*dx,
        y:A.y+t*dy
    };
}

function incenter(A,B,C){

    const a = distance(B,C);
    const b = distance(A,C);
    const c = distance(A,B);

    const sum = a+b+c;

    return {
        x:(a*A.x+b*B.x+c*C.x)/sum,
        y:(a*A.y+b*B.y+c*C.y)/sum
    };
}

function inradius(A,B,C){

    const a = distance(B,C);
    const b = distance(A,C);
    const c = distance(A,B);

    const s = (a+b+c)/2;

    const area =
        Math.abs(
            (B.x-A.x)*(C.y-A.y) -
            (C.x-A.x)*(B.y-A.y)
        )/2;

    return area/s;
}

function circumcenter(A,B,C){

    const D =
        2*(
            A.x*(B.y-C.y) +
            B.x*(C.y-A.y) +
            C.x*(A.y-B.y)
        );

    if(Math.abs(D)<0.00001){
        return null;
    }

    const a =
        A.x*A.x +
        A.y*A.y;

    const b =
        B.x*B.x +
        B.y*B.y;

    const c =
        C.x*C.x +
        C.y*C.y;

    return {

        x:
        (
            a*(B.y-C.y) +
            b*(C.y-A.y) +
            c*(A.y-B.y)
        )/D,

        y:
        (
            a*(C.x-B.x) +
            b*(A.x-C.x) +
            c*(B.x-A.x)
        )/D
    };
}

function createLine(p1,p2,color,dash=""){

    const line =
        document.createElementNS(
            NS,
            "line"
        );

    line.setAttribute("x1",p1.x);
    line.setAttribute("y1",p1.y);
    line.setAttribute("x2",p2.x);
    line.setAttribute("y2",p2.y);
    line.setAttribute("stroke",color);
    line.setAttribute("stroke-width","2");

    if(dash){
        line.setAttribute(
            "stroke-dasharray",
            dash
        );
    }

    extraLines.appendChild(line);
}

function createCircle(center,r,color){

    const circle =
        document.createElementNS(
            NS,
            "circle"
        );

    circle.setAttribute("cx",center.x);
    circle.setAttribute("cy",center.y);
    circle.setAttribute("r",r);
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke",color);
    circle.setAttribute("stroke-width","2");
    circle.setAttribute(
        "stroke-dasharray",
        "6 4"
    );

    extraLines.appendChild(circle);
}

function createPoint(center,color,label){

    const circle =
        document.createElementNS(
            NS,
            "circle"
        );

    circle.setAttribute("cx",center.x);
    circle.setAttribute("cy",center.y);

        );

    );

    text.setAttribute(
        "y",
        center.y-8
    );

    text.setAttribute(

        color
    );

    text.setAttribute(
        "font-size",
        "16"
    );

    text.setAttribute(
        "font-weight",
        "900"
    );

    text.textContent = label;

    extraLines.appendChild(text);
}

function classify(a,b,c,A,B,C){

    const maxSide =
        Math.max(a,b,c);

    const tolerance =
        maxSide*0.035;

    let sideType =
        "Різносторонній";

    if(
        Math.abs(a-b)<tolerance &&
        Math.abs(b-c)<tolerance
    ){
        sideType =
            "Рівносторонній";
    }
    else if(
        Math.abs(a-b)<tolerance ||
        Math.abs(b-c)<tolerance ||
        Math.abs(a-c)<tolerance
    ){
        sideType =
            "Рівнобедрений";
    }

    const maxAngle =
        Math.max(A,B,C);

    let angleType =
        "Гострокутний";

    if(Math.abs(maxAngle-90)<2){
        angleType =
            "Прямокутний";
    }
    else if(maxAngle>90){
        angleType =
            "Тупокутний";
    }

    return {
        sideType,
        angleType
    };
}

function renderTriangle(){

    const A = points.A;
    const B = points.B;
    const C = points.C;

    triangle.setAttribute(
        "points",
        `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`
    );

    const pointElements = {
        A:document.getElementById("pointA"),
        B:document.getElementById("pointB"),
        C:document.getElementById("pointC")
    };

    const labelElements = {
        A:document.getElementById("labelA"),
        B:document.getElementById("labelB"),
        C:document.getElementById("labelC")
    };

    ["A","B","C"].forEach(name=>{

        const p = points[name];

        pointElements[name]
            .setAttribute("cx",p.x);

        pointElements[name]
            .setAttribute("cy",p.y);

        labelElements[name]
            .setAttribute("x",p.x+13);

        labelElements[name]
            .setAttribute("y",p.y-13);
    });

    const a = distance(B,C);
    const b = distance(A,C);
    const c = distance(A,B);

    const angleA = angle(A,B,C);
    const angleB = angle(B,A,C);
    const angleC = angle(C,A,B);

    const scale = 3.5;

    const av = a/scale;
    const bv = b/scale;
    const cv = c/scale;

    const perimeter =
        av+bv+cv;

    const pixelArea =
        Math.abs(
            (B.x-A.x)*(C.y-A.y) -
            (C.x-A.x)*(B.y-A.y)
        )/2;

    const area =
        pixelArea /

    document.getElementById("dataGrid")

        <div class="data-cell">
            <div class="data-key">BC (a)</div>
            <div class="data-value">

            <div class="data-key">Площа</div>

            </div>

    `;

    const types =
        classify(

    document.getElementById("sideType")

        types.sideType;

    const valid1 =

    document.getElementById("ineqText")

    extraLines.innerHTML = "";
    sideLabels.innerHTML = "";

    if(mode === "medians"){

        const mA =
            midpoint(B,C);

        const mC =

        createLine(

            p2:C,
            text:"a = "+av.toFixed(1),
            color:"#15803d"
        },
        {
            p1:A,
            p2:C,
            text:"b = "+bv.toFixed(1),
            color:"#2563eb"
        },
        {
            p1:A,
            p2:B,
            text:"c = "+cv.toFixed(1),
            color:"#dc2626"
        }
    ];

    sideInfo.forEach(item=>{

        const m =
            midpoint(
                item.p1,
                item.p2
            );

        const text =
            document.createElementNS(
                NS,
                "text"
            );

        text.setAttribute(
            "x",
            m.x
        );

        text.setAttribute(
            "y",
            m.y-10
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "font-size",
            "15"
        );

        text.setAttribute(
            "font-weight",
            "900"
        );

        text.setAttribute(
            "fill",
            item.color
        );

        text.textContent =
            item.text;

        sideLabels.appendChild(text);
    });
}


/* =========================
   DRAGGING
========================= */

function svgPosition(event){

    const rect =
        svg.getBoundingClientRect();

    const source =
        event.touches
        ? event.touches[0]
        : event;

    return {
        x:
        (source.clientX-rect.left) *
        400/rect.width,

        y:
        (source.clientY-rect.top) *
        290/rect.height
    };
}

function findPoint(position){

    for(const name of ["A","B","C"]){

        const p =
            points[name];

        if(
            distance(
                position,
                p
            ) < 28
        ){
            return name;
        }
    }

    return null;
}

function startDrag(event){

    const position =
        svgPosition(event);

    dragging =
        findPoint(position);

    if(dragging){
        event.preventDefault();
    }
}

function moveDrag(event){

    if(!dragging){
        return;
    }

    const p =
        svgPosition(event);

    points[dragging] = {
        x:
        Math.max(
            15,
            Math.min(385,p.x)
        ),

        y:
        Math.max(
            15,
            Math.min(275,p.y)
        )
    };

    renderTriangle();

    if(event.cancelable){
        event.preventDefault();
    }
}

svg.addEventListener(
    "mousedown",
    startDrag
);

svg.addEventListener(
    "touchstart",
    startDrag,
    {passive:false}
);

document.addEventListener(
    "mousemove",
    moveDrag
);

document.addEventListener(
    "touchmove",
    moveDrag,
    {passive:false}
);

document.addEventListener(
    "mouseup",
    ()=>{
        dragging=null;
    }
);

document.addEventListener(
    "touchend",
    ()=>{
        dragging=null;
    }
);
