<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background (rounded for non-maskable) -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Radical sign: tick then vertical then vinculum -->
  <polyline
    points="72,288 128,348 208,108 456,108"
    stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- x² under the radical -->
  <text x="324" y="280"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="130"
    font-weight="bold"
    fill="white"
    text-anchor="middle">x</text>
  <text x="400" y="218"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="70"
    font-weight="bold"
    fill="white"
    text-anchor="middle">2</text>
</svg>
