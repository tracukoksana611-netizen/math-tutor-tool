<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>НМТ з математики</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }
      header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 10px 16px;
        border-bottom: 1px solid #e2e8f0;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      .title { min-width: 0; }
      .title strong { display: block; font-size: 15px; }
      .title span { display: block; margin-top: 2px; color: #64748b; font-size: 12px; }
      iframe { width: 100%; flex: 1; border: 0; background: white; }
      .error {
        display: none;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      @media (max-width: 520px) {
        header { min-height: 58px; padding: 8px 10px; }
        button { min-height: 40px; padding: 0 12px; font-size: 14px; }
        .title span { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <button id="back" type="button" aria-label="Повернутися до списку тестів">← Назад</button>
      <div class="title">
        <strong>НМТ з математики</strong>
        <span>Кнопка повернення залишається доступною під час і після тесту</span>
      </div>
    </header>
    <iframe id="test" title="Інтерактивний тест НМТ"></iframe>
    <div id="error" class="error">Не вдалося відкрити цей тест.</div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const source = params.get('src') || '';
      const allowed = /^past-nmt\/(?:2023|2024|2025|2026)\/[a-z0-9-]+\.html$/;
      const frame = document.getElementById('test');
      const error = document.getElementById('error');

      document.getElementById('back').addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = './past-nmt';
        }
      });

      if (allowed.test(source)) {
        frame.src = `./${source}`;
      } else {
        frame.style.display = 'none';
        error.style.display = 'flex';
      }
    </script>
  </body>
</html>
